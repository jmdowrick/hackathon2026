[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ala2bg"
version = "0.1.0"
description = "Trajectories to thermodynamically consistent port-Hamiltonian bond graphs"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
full = ["torch", "deeptime", "mdtraj", "mdshare", "matplotlib"]
md = ["openmm", "openmmtools", "mdtraj"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ala2bg = "ala2bg.cli:main"
